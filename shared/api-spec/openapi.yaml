openapi: 3.0.3
info:
  title: Support Bridge API
  description: Customer support platform bridging WhatsApp with internal team collaboration
  version: 1.0.0
  contact:
    name: Schoolable Support
    
servers:
  - url: http://localhost:8080/api/v1
    description: Development server

tags:
  - name: Auth
  - name: Conversations
  - name: Messages
  - name: Agents
  - name: Tasks
  - name: Teams
  - name: Tickets

paths:
  /webhooks/whatsapp:
    get:
      tags: [Webhooks]
      summary: WhatsApp webhook verification
      parameters:
        - name: hub.mode
          in: query
          schema: { type: string }
        - name: hub.verify_token
          in: query
          schema: { type: string }
        - name: hub.challenge
          in: query
          schema: { type: string }
      responses:
        '200': { description: Verification response }
        '403': { description: Verification failed }
    post:
      tags: [Webhooks]
      summary: WhatsApp webhook receiver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200': { description: Webhook processed }

  /ws:
    get:
      tags: [WebSocket]
      summary: WebSocket connection (Authorization: Bearer token)
      responses:
        '101': { description: Switching Protocols }

    /auth/register:
    post:
      tags: [Auth]
      summary: Agent registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  agent: { $ref: '#/components/schemas/Agent' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Agent login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  agent: { $ref: '#/components/schemas/Agent' }

  /conversations:
    get:
      tags: [Conversations]
      summary: List conversations
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, pending, resolved, closed] }
        - name: agent_id
          in: query
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: List of conversations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Conversation' }

  /conversations/{id}:
    get:
      tags: [Conversations]
      summary: Get conversation details
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Conversation details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Conversation' }

  /conversations/{id}/messages:
    get:
      tags: [Messages]
      summary: Get messages for a conversation
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of messages
    post:
      tags: [Messages]
      summary: Send a message
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                message_type: { type: string, enum: [text, image, document] }
      responses:
        '201':
          description: Message sent

  /agents:
    get:
      tags: [Agents]
      summary: List agents
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of agents

  /tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [todo, in_progress, blocked, done] }
        - name: assigned_to
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of tasks
    post:
      tags: [Tasks]
      summary: Create task
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                assigned_to_id: { type: string, format: uuid }
                priority: { type: string, enum: [low, medium, high, urgent] }
                due_date: { type: string, format: date-time }
      responses:
        '201':
          description: Task created

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Agent:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [agent, supervisor, admin] }
        status: { type: string, enum: [online, away, busy, offline] }
        team_id: { type: string, format: uuid }
        is_active: { type: boolean }

    Conversation:
      type: object
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid }
        assigned_agent_id: { type: string, format: uuid }
        status: { type: string, enum: [open, pending, resolved, closed] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        channel: { type: string }
        last_message_at: { type: string, format: date-time }
        unread_count: { type: integer }

    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        sender_type: { type: string, enum: [agent, parent, system, bot] }
        content: { type: string }
        message_type: { type: string, enum: [text, image, document, audio, video] }
        status: { type: string, enum: [pending, sent, delivered, read, failed] }
        sent_at: { type: string, format: date-time }

    Task:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [todo, in_progress, blocked, done] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        due_date: { type: string, format: date-time }

    PaginatedResponse:
      type: object
      properties:
        success: { type: boolean }
        pagination:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            total_pages: { type: integer }
